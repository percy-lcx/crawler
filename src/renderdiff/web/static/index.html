<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>renderdiff</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
         background: #0d1117; color: #c9d1d9; line-height: 1.5; min-height: 100vh; }

  /* Layout */
  .container { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem; }
  h1 { color: #f0f6fc; margin-bottom: .25rem; font-size: 1.75rem; }
  .subtitle { color: #8b949e; margin-bottom: 2rem; font-size: .9rem; }

  /* Form */
  .form-section { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; }
  label { display: block; color: #8b949e; font-size: .85rem; margin-bottom: .35rem; text-transform: uppercase; letter-spacing: .04em; }
  textarea, input[type="text"], input[type="number"] { width: 100%; background: #0d1117; border: 1px solid #30363d;
    color: #c9d1d9; border-radius: 6px; padding: .6rem .75rem; font-size: .9rem; font-family: inherit; }
  textarea:focus, input:focus { outline: none; border-color: #58a6ff; }
  textarea { resize: vertical; min-height: 90px; }
  .form-row { display: flex; gap: 1rem; margin-top: 1rem; }
  .form-row > div { flex: 1; }
  .advanced-toggle { color: #58a6ff; cursor: pointer; font-size: .85rem; margin-top: .75rem; display: inline-block; }
  .advanced-toggle:hover { text-decoration: underline; }
  .advanced-section { display: none; margin-top: 1rem; }
  .advanced-section.open { display: block; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: .5rem; padding: .6rem 1.5rem; border-radius: 6px;
         border: 1px solid transparent; font-size: .9rem; font-weight: 600; cursor: pointer; transition: .15s; }
  .btn-primary { background: #238636; color: #fff; border-color: #2ea043; margin-top: 1rem; }
  .btn-primary:hover { background: #2ea043; }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
  .btn-secondary { background: #21262d; color: #c9d1d9; border-color: #30363d; margin-top: 1rem; }
  .btn-secondary:hover { background: #30363d; }

  /* Progress */
  .progress-section { display: none; margin-bottom: 1.5rem; }
  .progress-section.active { display: block; }
  .progress-bar-wrap { background: #21262d; border-radius: 6px; height: 8px; margin-bottom: 1rem; overflow: hidden; }
  .progress-bar { height: 100%; background: #238636; border-radius: 6px; transition: width .3s; width: 0%; }
  .progress-text { color: #8b949e; font-size: .85rem; margin-bottom: .5rem; }
  .url-status-list { list-style: none; }
  .url-status-item { padding: .35rem 0; font-size: .85rem; display: flex; align-items: center; gap: .5rem;
                     border-bottom: 1px solid #21262d; }
  .url-status-item:last-child { border-bottom: none; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #30363d;
             border-top-color: #58a6ff; border-radius: 50%; animation: spin .6s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Summary */
  .summary { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .summary .stat { padding: .6rem 1rem; border-radius: 8px; font-weight: 600; font-size: 1rem; }
  .stat-pass { background: #0d1f0d; color: #3fb950; border: 1px solid #238636; }
  .stat-warn { background: #1f1d0d; color: #d29922; border: 1px solid #9e6a03; }
  .stat-fail { background: #1f0d0d; color: #f85149; border: 1px solid #da3633; }
  .stat-skip { background: #161b22; color: #8b949e; border: 1px solid #30363d; }

  /* Filters */
  .filters { display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
  .filter-btn { padding: .3rem .75rem; border-radius: 12px; font-size: .8rem; font-weight: 600; cursor: pointer;
                border: 1px solid #30363d; background: #21262d; color: #8b949e; transition: .15s; }
  .filter-btn.active { color: #fff; }
  .filter-btn.active[data-severity="critical"] { background: #da3633; border-color: #da3633; }
  .filter-btn.active[data-severity="warning"] { background: #9e6a03; border-color: #9e6a03; }
  .filter-btn.active[data-severity="info"] { background: #1f6feb; border-color: #1f6feb; }
  .filter-btn.active[data-severity="pass"] { background: #238636; border-color: #238636; }
  .filter-search { background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; border-radius: 6px;
                   padding: .3rem .6rem; font-size: .8rem; width: 200px; }

  /* URL cards */
  .url-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; margin-bottom: 1rem; overflow: hidden; }
  .url-header { padding: .75rem 1rem; border-bottom: 1px solid #30363d; display: flex;
                justify-content: space-between; align-items: center; cursor: pointer; }
  .url-header:hover { background: #1c2129; }
  .url-header h2 { font-size: .9rem; color: #58a6ff; word-break: break-all; font-weight: 500; }
  .badge { padding: .2rem .6rem; border-radius: 12px; font-size: .75rem; font-weight: 600; text-transform: uppercase; }
  .badge-pass { background: #238636; color: #fff; }
  .badge-warn { background: #9e6a03; color: #fff; }
  .badge-fail { background: #da3633; color: #fff; }
  .badge-skip { background: #30363d; color: #8b949e; }
  .url-body { padding: 1rem; display: none; }
  .url-card.expanded .url-body { display: block; }

  /* Diff table */
  .diff-table { width: 100%; border-collapse: collapse; margin-bottom: .75rem; }
  .diff-table th { text-align: left; padding: .4rem .6rem; background: #0d1117;
                   color: #8b949e; font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; }
  .diff-table td { padding: .4rem .6rem; border-top: 1px solid #21262d; font-size: .85rem; vertical-align: top; }
  .diff-table tr.critical td { border-left: 3px solid #f85149; }
  .diff-table tr.warning td { border-left: 3px solid #d29922; }
  .diff-table tr.info td { border-left: 3px solid #58a6ff; }
  .sev { font-weight: 600; text-transform: uppercase; font-size: .7rem; }
  .sev-critical { color: #f85149; }
  .sev-warning { color: #d29922; }
  .sev-info { color: #58a6ff; }
  .val { font-family: 'SF Mono', Consolas, monospace; font-size: .78rem; color: #8b949e;
         max-width: 250px; overflow-wrap: break-word; }
  .val-raw { color: #f85149; }
  .val-rendered { color: #3fb950; }
  .diff-table td ul { list-style-type: disc; margin-left: 1rem; }

  /* Screenshot & signals */
  details { margin-top: .75rem; }
  details summary { cursor: pointer; color: #58a6ff; font-size: .85rem; margin-bottom: .4rem; }
  details summary:hover { text-decoration: underline; }
  .screenshot img { max-width: 100%; border: 1px solid #30363d; border-radius: 6px; margin-top: .4rem; }
  .signals-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; padding: .5rem 0; }
  .signals-col h3 { font-size: .8rem; color: #8b949e; margin-bottom: .4rem; text-transform: uppercase; letter-spacing: .04em; }
  .signals-col table { width: 100%; font-size: .78rem; }
  .signals-col td { padding: .2rem .4rem; border-top: 1px solid #21262d; }
  .signals-col td:first-child { color: #8b949e; width: 40%; }
  .no-diffs { color: #3fb950; padding: .4rem 0; font-size: .9rem; }
  .skip-reason { color: #8b949e; font-style: italic; }

  /* Results section */
  #results-section { display: none; }
  #results-section.active { display: block; }
</style>
</head>
<body>

<div class="container">
  <h1>renderdiff</h1>
  <p class="subtitle">Compare raw HTML vs JavaScript-rendered DOM for SEO signal discrepancies</p>

  <!-- Input Form -->
  <div id="form-section" class="form-section">
    <div>
      <label for="urls-input">URLs (one per line)</label>
      <textarea id="urls-input" placeholder="https://example.com&#10;https://example.com/about"></textarea>
    </div>

    <span class="advanced-toggle" id="advanced-toggle">Advanced options</span>
    <div class="advanced-section" id="advanced-section">
      <div>
        <label for="sitemap-input">Sitemap URL (optional)</label>
        <input type="text" id="sitemap-input" placeholder="https://example.com/sitemap.xml">
      </div>
      <div class="form-row">
        <div>
          <label for="concurrency-input">Concurrency</label>
          <input type="number" id="concurrency-input" value="3" min="1" max="10">
        </div>
        <div>
          <label for="delay-input">Delay (seconds)</label>
          <input type="number" id="delay-input" value="1" min="0" max="10" step="0.5">
        </div>
        <div>
          <label for="limit-input">URL limit</label>
          <input type="number" id="limit-input" placeholder="No limit" min="1" max="500">
        </div>
      </div>
    </div>

    <button class="btn btn-primary" id="start-btn" onclick="startScan()">Start Scan</button>
  </div>

  <!-- Progress -->
  <div class="progress-section" id="progress-section">
    <div class="progress-text" id="progress-text">Preparing scan...</div>
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <ul class="url-status-list" id="url-status-list"></ul>
  </div>

  <!-- Results -->
  <div id="results-section">
    <div class="summary" id="summary-bar"></div>
    <div class="filters" id="filters-bar">
      <button class="filter-btn active" data-severity="critical" onclick="toggleFilter(this)">Critical</button>
      <button class="filter-btn active" data-severity="warning" onclick="toggleFilter(this)">Warning</button>
      <button class="filter-btn active" data-severity="info" onclick="toggleFilter(this)">Info</button>
      <button class="filter-btn active" data-severity="pass" onclick="toggleFilter(this)">Pass</button>
      <input type="text" class="filter-search" id="url-search" placeholder="Filter by URL..." oninput="applyFilters()">
    </div>
    <div id="results-list"></div>
    <button class="btn btn-secondary" onclick="resetUI()">New Scan</button>
  </div>
</div>

<script>
let currentRunId = null;
let totalUrls = 0;
let completedUrls = 0;
let urlReports = [];

// Advanced toggle
document.getElementById('advanced-toggle').addEventListener('click', function() {
  const sec = document.getElementById('advanced-section');
  sec.classList.toggle('open');
  this.textContent = sec.classList.contains('open') ? 'Hide options' : 'Advanced options';
});

async function startScan() {
  const urlsText = document.getElementById('urls-input').value.trim();
  const sitemap = document.getElementById('sitemap-input').value.trim();
  const concurrency = parseInt(document.getElementById('concurrency-input').value) || 3;
  const delay = parseFloat(document.getElementById('delay-input').value) || 1;
  const limitVal = document.getElementById('limit-input').value.trim();
  const limit = limitVal ? parseInt(limitVal) : null;

  const urls = urlsText ? urlsText.split('\n').map(u => u.trim()).filter(u => u) : [];
  if (!urls.length && !sitemap) {
    alert('Please enter at least one URL or a sitemap URL.');
    return;
  }

  const btn = document.getElementById('start-btn');
  btn.disabled = true;
  btn.textContent = 'Starting...';

  try {
    const body = { urls, concurrency, delay };
    if (sitemap) body.sitemap = sitemap;
    if (limit) body.limit = limit;

    const res = await fetch('/api/scan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    if (!res.ok) {
      const err = await res.json();
      alert(err.detail || 'Failed to start scan');
      btn.disabled = false;
      btn.textContent = 'Start Scan';
      return;
    }

    const data = await res.json();
    currentRunId = data.run_id;
    totalUrls = data.total_urls;
    completedUrls = 0;
    urlReports = [];

    // Switch to progress view
    document.getElementById('form-section').style.display = 'none';
    const progressSection = document.getElementById('progress-section');
    progressSection.classList.add('active');
    document.getElementById('progress-text').textContent = `0 / ${totalUrls} URLs processed`;
    document.getElementById('progress-bar').style.width = '0%';
    document.getElementById('url-status-list').innerHTML = '';
    document.getElementById('results-list').innerHTML = '';
    document.getElementById('summary-bar').innerHTML = '';

    connectSSE(currentRunId);
  } catch (e) {
    alert('Error: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'Start Scan';
  }
}

function connectSSE(runId) {
  const es = new EventSource(`/api/scan/${runId}/stream`);

  es.addEventListener('url_start', function(e) {
    const data = JSON.parse(e.data);
    const list = document.getElementById('url-status-list');
    const li = document.createElement('li');
    li.className = 'url-status-item';
    li.id = `url-item-${data.index}`;
    li.innerHTML = `<span class="spinner"></span><span>${escapeHtml(data.url)}</span>`;
    list.appendChild(li);
  });

  es.addEventListener('url_done', function(e) {
    const report = JSON.parse(e.data);
    urlReports.push(report);
    completedUrls++;

    // Update progress
    const pct = Math.round((completedUrls / totalUrls) * 100);
    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('progress-text').textContent = `${completedUrls} / ${totalUrls} URLs processed`;

    // Update status list item
    const idx = urlReports.length - 1;
    // Find the matching url-status-item by URL
    const items = document.querySelectorAll('.url-status-item');
    for (const item of items) {
      if (item.querySelector('span:last-child')?.textContent === report.url) {
        const status = report.skipped ? 'skip' : report.overall_status;
        const badgeClass = `badge-${status}`;
        const badgeText = status.toUpperCase();
        item.innerHTML = `<span class="badge ${badgeClass}">${badgeText}</span><span>${escapeHtml(report.url)}</span>`;
        break;
      }
    }

    // Show results section and add card
    const resultsSection = document.getElementById('results-section');
    resultsSection.classList.add('active');
    document.getElementById('results-list').appendChild(createUrlCard(report));
  });

  es.addEventListener('scan_complete', function(e) {
    const report = JSON.parse(e.data);
    es.close();

    // Hide progress
    document.getElementById('progress-section').classList.remove('active');
    document.getElementById('progress-text').textContent = 'Scan complete';

    // Show summary
    renderSummary(report);
  });

  es.addEventListener('error', function(e) {
    if (e.data) {
      const data = JSON.parse(e.data);
      alert('Scan error: ' + data.message);
    }
    es.close();
    resetUI();
  });

  es.onerror = function() {
    // EventSource reconnect or final close
    setTimeout(() => {
      if (es.readyState === EventSource.CLOSED) {
        document.getElementById('progress-section').classList.remove('active');
      }
    }, 1000);
  };
}

function renderSummary(report) {
  const bar = document.getElementById('summary-bar');
  bar.innerHTML = `
    <div class="stat stat-pass">${report.passed} Passed</div>
    <div class="stat stat-warn">${report.warned} Warned</div>
    <div class="stat stat-fail">${report.failed} Failed</div>
    <div class="stat stat-skip">${report.skipped} Skipped</div>
  `;
}

function createUrlCard(r) {
  const card = document.createElement('div');
  const status = r.skipped ? 'skip' : r.overall_status;
  card.className = 'url-card';
  card.dataset.status = status;
  card.dataset.url = r.url.toLowerCase();

  // Determine highest severity for filtering
  const severities = (r.diffs || []).map(d => d.severity);
  card.dataset.hasCritical = severities.includes('critical') ? '1' : '0';
  card.dataset.hasWarning = severities.includes('warning') ? '1' : '0';
  card.dataset.hasInfo = severities.includes('info') ? '1' : '0';

  const badgeClass = `badge-${status}`;
  const badgeText = status.toUpperCase();

  // Header
  const header = document.createElement('div');
  header.className = 'url-header';
  header.innerHTML = `<h2>${escapeHtml(r.url)}</h2><span class="badge ${badgeClass}">${badgeText}</span>`;
  header.addEventListener('click', () => card.classList.toggle('expanded'));
  card.appendChild(header);

  // Body
  const body = document.createElement('div');
  body.className = 'url-body';

  // Show render error if present
  if (r.render && r.render.error) {
    const warn = document.createElement('div');
    warn.className = 'skip-reason';
    warn.textContent = 'Render warning: ' + r.render.error;
    body.appendChild(warn);
  }

  if (r.skipped) {
    body.innerHTML = `<div class="skip-reason">Skipped: ${escapeHtml(r.skip_reason || 'unknown')}</div>`;
  } else if (!r.diffs || r.diffs.length === 0) {
    body.innerHTML = '<div class="no-diffs">No differences found &mdash; raw and rendered HTML match.</div>';
  } else {
    body.appendChild(createDiffTable(r.diffs));
  }

  // Screenshot
  if (r.render && r.render.screenshot_path) {
    const details = document.createElement('details');
    details.className = 'screenshot';
    details.setAttribute('open', '');
    details.innerHTML = `<summary>Screenshot (rendered page)</summary>
      <img src="/api/scan/${currentRunId}/screenshot/${encodeURIComponent(r.render.screenshot_path)}"
           alt="Screenshot of ${escapeHtml(r.url)}" loading="lazy">`;
    body.appendChild(details);
  } else if (r.render && !r.skipped) {
    const note = document.createElement('div');
    note.className = 'skip-reason';
    note.textContent = 'Screenshot not available';
    body.appendChild(note);
  }

  // Signal comparison
  if (r.raw_signals && r.rendered_signals) {
    const details = document.createElement('details');
    details.className = 'signals';
    details.innerHTML = `<summary>Full signal comparison</summary>
      <div class="signals-grid">
        <div class="signals-col"><h3>Raw HTML</h3>${renderSignalsTable(r.raw_signals)}</div>
        <div class="signals-col"><h3>Rendered DOM</h3>${renderSignalsTable(r.rendered_signals)}</div>
      </div>`;
    body.appendChild(details);
  }

  card.appendChild(body);
  return card;
}

function createDiffTable(diffs) {
  const table = document.createElement('table');
  table.className = 'diff-table';
  table.innerHTML = `<thead><tr><th>Severity</th><th>Field</th><th>Message</th><th>Raw</th><th>Rendered</th></tr></thead>`;
  const tbody = document.createElement('tbody');

  for (const d of diffs) {
    const tr = document.createElement('tr');
    tr.className = d.severity;
    tr.innerHTML = `
      <td><span class="sev sev-${d.severity}">${d.severity}</span></td>
      <td>${escapeHtml(d.field)}</td>
      <td>${escapeHtml(d.message)}${renderDetails(d.details)}</td>
      <td><span class="val val-raw">${formatValue(d.raw_value)}</span></td>
      <td><span class="val val-rendered">${formatValue(d.rendered_value)}</span></td>
    `;
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  return table;
}

function formatValue(val) {
  if (val === null || val === undefined) return '<em>none</em>';
  let s = String(val);
  if (s.length > 200) s = s.slice(0, 200) + '...';
  return escapeHtml(s);
}

function renderDetails(details) {
  if (!details) return '';
  let html = '';
  const sections = [
    { key: 'only_in_rendered', label: 'Only in rendered', cls: 'val-rendered' },
    { key: 'only_in_raw', label: 'Only in raw', cls: 'val-raw' },
  ];
  for (const sec of sections) {
    const items = details[sec.key];
    if (!items || !items.length) continue;
    const maxItems = 20;
    const lis = items.slice(0, maxItems).map(i => `<li>${escapeHtml(i)}</li>`).join('');
    const overflow = items.length > maxItems ? `<li><em>...and ${items.length - maxItems} more</em></li>` : '';
    html += `<div class="${sec.cls}" style="margin-top:.25rem">
      <strong>${sec.label} (${items.length}):</strong>
      <ul style="font-size:.78rem">${lis}${overflow}</ul></div>`;
  }
  return html;
}

function renderSignalsTable(s) {
  const rows = [
    ['title', s.title || '\u2014'],
    ['description', s.meta_description || '\u2014'],
    ['canonical', s.canonical || '\u2014'],
    ['robots', s.robots_meta || '\u2014'],
    ['h1', s.h1_texts && s.h1_texts.length ? s.h1_texts.join(', ') : '\u2014'],
    ['h2', s.h2_texts && s.h2_texts.length ? s.h2_texts.join(', ') : '\u2014'],
    ['structured data', s.structured_data && s.structured_data.length ? s.structured_data.map(d => d.sd_type).join(', ') : '\u2014'],
    ['internal links', String((s.internal_links || []).length)],
    ['images', String((s.images || []).length)],
    ['hreflang', s.hreflang && s.hreflang.length ? s.hreflang.map(h => h.lang).join(', ') : '\u2014'],
    ['word count', String(s.word_count || 0)],
    ['html size', (s.html_size_bytes || 0).toLocaleString() + ' B'],
  ];
  return '<table>' + rows.map(([k, v]) =>
    `<tr><td>${escapeHtml(k)}</td><td>${escapeHtml(v)}</td></tr>`
  ).join('') + '</table>';
}

// Filters
function toggleFilter(btn) {
  btn.classList.toggle('active');
  applyFilters();
}

function applyFilters() {
  const activeSeverities = new Set();
  document.querySelectorAll('.filter-btn.active').forEach(b => activeSeverities.add(b.dataset.severity));
  const searchTerm = (document.getElementById('url-search').value || '').toLowerCase();

  document.querySelectorAll('.url-card').forEach(card => {
    const url = card.dataset.url;
    const status = card.dataset.status;

    // URL search filter
    if (searchTerm && !url.includes(searchTerm)) {
      card.style.display = 'none';
      return;
    }

    // Severity filter
    let show = false;
    if (status === 'pass' && activeSeverities.has('pass')) show = true;
    if (status === 'skip' && activeSeverities.has('pass')) show = true;
    if (card.dataset.hasCritical === '1' && activeSeverities.has('critical')) show = true;
    if (card.dataset.hasWarning === '1' && activeSeverities.has('warning')) show = true;
    if (card.dataset.hasInfo === '1' && activeSeverities.has('info')) show = true;
    // If card has no diffs and is pass, show under "pass" filter
    if (status === 'pass' && activeSeverities.has('pass')) show = true;
    // Fail/warn cards: show if their severity is active
    if (status === 'fail' && activeSeverities.has('critical')) show = true;
    if (status === 'warn' && activeSeverities.has('warning')) show = true;

    card.style.display = show ? '' : 'none';
  });
}

function resetUI() {
  currentRunId = null;
  totalUrls = 0;
  completedUrls = 0;
  urlReports = [];
  document.getElementById('form-section').style.display = '';
  document.getElementById('start-btn').disabled = false;
  document.getElementById('start-btn').textContent = 'Start Scan';
  document.getElementById('progress-section').classList.remove('active');
  document.getElementById('results-section').classList.remove('active');
  document.getElementById('results-list').innerHTML = '';
  document.getElementById('summary-bar').innerHTML = '';
  document.getElementById('url-status-list').innerHTML = '';
  document.getElementById('progress-bar').style.width = '0%';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
