[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "renderdiff"
version = "0.1.0"
description = "Compare raw HTML vs rendered DOM for SEO signal discrepancies"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9,<1.0",
    "httpx>=0.27,<1.0",
    "playwright>=1.40,<2.0",
    "beautifulsoup4>=4.12,<5.0",
    "pydantic>=2.5,<3.0",
    "lxml>=5.0,<6.0",
    "rich>=13.0,<14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
renderdiff = "renderdiff.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/renderdiff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
